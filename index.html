<title>Reforma Málaga · Tu obra, de antes a después</title>
<style>
:root{--ink:#14213d;--sea:#0b6e99;--sun:#f2a541;--bg:#f6f4ef;--card:#fff;--ok:#2a9d6f;--bad:#d1495b;--mut:#6b7280}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Inter,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#0b3c5d,#0b6e99);color:#fff;padding:18px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:20px}header small{opacity:.8;display:block}
nav{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e7eb;overflow:auto;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:14px 14px;font:inherit;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--sea);border-color:var(--sun);font-weight:600}
main{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0001}
.kpi b{display:block;font-size:26px}.kpi span{color:var(--mut);font-size:13px}
button.p,label.p{background:var(--sea);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font:inherit;display:inline-block}
button.s{background:#e8eef3;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit}
button.d{background:none;border:0;color:var(--bad);cursor:pointer}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #d1d5db;border-radius:8px;max-width:100%}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:14px}th{color:var(--mut);font-weight:600}
td input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:#e8eef3}.warn{background:#fff4e0;border-left:4px solid var(--sun);padding:10px 12px;border-radius:8px;font-size:13px;margin:10px 0}
.ba{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#ddd;user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .top{clip-path:inset(0 50% 0 0)}.ba input{position:absolute;bottom:8px;left:5%;width:90%}
.ba em{position:absolute;top:8px;font-style:normal;background:#000a;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px}
.bar{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
h2{margin:6px 0 12px}.hide{display:none}.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media print{header,nav,.noprint{display:none}}
</style></head><body>

function mkDemo(){const R=[['Cocina',10],['Baño',5],['Salón',22],['Dormitorio',12]].map(([n,m])=>({id:uid(),name:n,m2:m,demo:1,...(DEMO_IMG[n]||{})}));
const I=[['Cocina','Demolición y retirada de escombros',1,'ud',650],['Cocina','Alicatado azulejo metro',22,'m2',42],['Cocina','Suelo porcelánico',10,'m2',48],['Cocina','Muebles altos y bajos',1,'ud',3800],['Cocina','Encimera de cuarzo',3.5,'ml',260],['Cocina','Electricidad y fontanería',1,'ud',1400],['Cocina','Placa, horno y campana',1,'ud',0],
['Baño','Cambio de bañera por plato de ducha',1,'ud',1250],['Baño','Alicatado',28,'m2',45],['Baño','Sanitarios y grifería',1,'ud',900],['Baño','Mueble de lavabo',1,'ud',0],
['Salón','Pintura paredes y techo',70,'m2',9],['Salón','Suelo laminado',22,'m2',32],['Salón','Rodapié',18,'ml',6],
['Dormitorio','Pintura',48,'m2',9],['Dormitorio','Armario empotrado',1,'ud',1600]].map(([room,desc,qty,unit,price])=>({id:uid(),room,desc,qty,unit,price}));
const O=[];[['Empresa Demo A',1],['Empresa Demo B',1.08],['Empresa Demo C',0.95]].forEach(([co,f])=>I.filter(i=>i.room=='Cocina'&&i.price).forEach(i=>O.push({id:uid(),co,desc:i.desc,qty:i.qty,price:Math.round(i.price*f)})));O.splice(4,1);
const P=[['Señal Empresa Demo A (30 por ciento)',3000,'2026-12-10',true],['Pago a mitad de obra',3000,'2027-01-20',false],['Pago final tras repasos',2000,'2027-02-28',false]].map(([c,a,d,p])=>({id:uid(),c,amt:a,d,paid:p}));
return {rooms:R,items:I,offers:O,pays:P}}
function loadDemo(){const d=mkDemo();S.rooms=d.rooms;S.items=d.items;S.offers=d.offers;S.pays=d.pays;save();go('home')}

function clearZone(z){const n={rooms:'estancias y fotos',items:'presupuesto',offers:'ofertas',pays:'pagos',cos:'empresas',tasks:'tareas (vuelven a la lista inicial)'}[z];if(!z||!confirm('¿Borrar '+n+'?'))return;if(z=='tasks')S.tasks=T0.map(([f,t],i)=>({id:i,f,t,done:false}));else S[z]=[];save();render()}

const save=()=>localStorage.rmm=JSON.stringify(S);const uid=()=>Math.random().toString(36).slice(2,9);
const eur=n=>(+n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS=[['home','Resumen'],['rooms','Estancias y fotos'],['budget','Presupuesto'],['offers','Ofertas'],['cos','Empresas Málaga'],['tasks','Tareas por fase'],['pays','Pagos'],['permits','Trámites y tasas'],['data','Datos / CSV']];
let tab='home';

const total=()=>S.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
const withTax=b=>b*(1+S.set.iva/100)+b*S.set.icio/100;
function csvParse(t){const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==sep){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
const num=s=>parseFloat(String(s).replace(/[€\s]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'))||0;
function csvOut(h,rows){return '\ufeff'+[h,...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\n')}
function dl(name,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=name;a.click()}
function readFile(f,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(f)}
function readImg(f,cb){const im=new Image(),r=new FileReader();r.onload=()=>{im.onload=()=>{const m=1000,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)}
function render(){const A=document.getElementById('app');A.innerHTML=({home,rooms,budget,offers,cos,tasks,pays,permits,data}[tab])()}
function home(){const done=S.tasks.filter(t=>t.done).length,pct=Math.round(100*done/S.tasks.length),noPrice=S.items.filter(i=>!+i.price).length,t=total(),paid=S.pays.filter(p=>p.paid).reduce((a,p)=>a+ +p.amt,0),over=S.set.budgetMax&&withTax(t)>S.set.budgetMax;
return `<h2>Tu reforma en Málaga</h2>${S.rooms.some(r=>r.demo)?'<div class="warn">Estás viendo <b>datos de ejemplo ficticios</b> (imágenes generadas por IA, presupuestos y empresas «Demo» inventados). Bórralos en «Datos / CSV» cuando quieras empezar con los tuyos.</div>':''}<div class="grid">
<div class="card kpi"><b>${S.rooms.length}</b><span>estancias · ${S.rooms.reduce((a,r)=>a+(+r.m2||0),0)} m²</span></div>
<div class="card kpi"><b>${eur(withTax(t))}</b><span>estimado con IVA e ICIO ${over?'· <b style="color:var(--bad);display:inline;font-size:13px">supera tu máximo</b>':''}</span></div>
<div class="card kpi"><b>${noPrice}</b><span>partidas sin precio</span></div>
<div class="card kpi"><b>${eur(paid)}</b><span>pagado hasta hoy</span></div>
<div class="card kpi"><b>${pct}%</b><span>tareas hechas (${done}/${S.tasks.length})</span><div class="bar"><i style="width:${pct}%"></i></div></div></div>
<div class="card" style="margin-top:14px"><h3>Cómo empezó</h3>${S.rooms.some(r=>r.before)?'<div class="grid">'+S.rooms.filter(r=>r.before).map(r=>`<div><b>${esc(r.name)}</b>${ba(r)}</div>`).join('')+'</div>':'<p>Sube una foto de cada estancia en <a href="#" onclick="go(\'rooms\');return false">Estancias y fotos</a> para guardar el estado inicial y compararlo después.</p>'}</div>
<div class="card" style="margin-top:14px"><h3>Por dónde empiezo</h3><ol><li>Crea tus estancias y sube las fotos de antes.</li><li>Importa tu presupuesto en CSV (Datos / CSV).</li><li>Importa o añade empresas de Málaga y compara ofertas.</li><li>Revisa los trámites y tasas de tu zona.</li></ol></div>`}
function ba(r){if(!r.before)return '';if(!r.after)return `<div class="ba"><img src="${r.before}"><em style="left:8px">Antes</em></div>`;return `<div class="ba"><img src="${r.after}"><img class="top" id="t${r.id}" src="${r.before}"><em style="left:8px">Antes</em><em style="right:8px">Después</em><input type="range" min="0" max="100" value="50" oninput="document.getElementById('t${r.id}').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)'"></div>`}
function rooms(){return `<h2>Estancias y fotos</h2><div class="row noprint"><input id="rn" placeholder="Nombre (ej. Cocina)"><input id="rm" type="number" placeholder="m²" style="width:90px"><button class="p" onclick="addRoom()">Añadir estancia</button></div>
<div class="grid">${S.rooms.map(r=>{const its=S.items.filter(i=>i.room==r.name),sub=its.reduce((a,i)=>a+i.qty*i.price,0);return `<div class="card"><b>${esc(r.name)}</b> <span class="tag">${r.m2||0} m²</span> <button class="d" onclick="delRoom('${r.id}')">✕</button>${ba(r)||'<div class="ba"><em style="left:8px">Sin foto</em></div>'}
<div class="row noprint"><label class="s" style="padding:7px 12px;border-radius:9px;background:#e8eef3;cursor:pointer">📷 Foto de antes<input type="file" accept="image/*" hidden onchange="photo('${r.id}','before',this.files[0])"></label><label style="padding:7px 12px;border-radius:9px;background:#e8eef3;cursor:pointer">✅ Foto de después<input type="file" accept="image/*" hidden onchange="photo('${r.id}','after',this.files[0])"></label></div>
<small>${its.length} partidas · ${eur(sub)}</small></div>`}).join('')||'<p>Aún no hay estancias.</p>'}</div>
<p class="warn">Las fotos se guardan en este navegador. Haz copia con «Datos / CSV → Copia completa» para no perderlas.</p>`}
function addRoom(){const n=rn.value.trim();if(!n)return;S.rooms.push({id:uid(),name:n,m2:+rm.value||0});save();render()}
function delRoom(id){if(confirm('¿Borrar estancia? Las partidas se quedan sin estancia.')){S.rooms=S.rooms.filter(r=>r.id!=id);save();render()}}
function photo(id,k,f){if(!f)return;readImg(f,d=>{S.rooms.find(r=>r.id==id)[k]=d;save();render()})}
function budget(){const g={};S.items.forEach(i=>{g[i.room||'Sin estancia']=(g[i.room||'Sin estancia']||0)+i.qty*i.price});const t=total();
return `<h2>Presupuesto</h2><div class="row noprint"><select id="ir"><option value="">Sin estancia</option>${S.rooms.map(r=>`<option>${esc(r.name)}</option>`).join('')}</select><input id="id" placeholder="Partida (ej. Alicatado baño)"><input id="iq" type="number" placeholder="Cant." style="width:80px"><input id="iu" placeholder="Ud." style="width:70px"><input id="ip" type="number" placeholder="€/ud" style="width:90px"><button class="p" onclick="addItem()">Añadir</button><button class="s" onclick="go('data')">Importar CSV</button></div>
<div class="card" style="overflow:auto"><table><tr><th>Estancia</th><th>Partida</th><th>Cant.</th><th>Ud.</th><th>€/ud</th><th>Total</th><th>Estado</th><th></th></tr>${S.items.map(i=>`<tr><td>${esc(i.room)}</td><td>${esc(i.desc)}</td><td>${i.qty}</td><td>${esc(i.unit)}</td><td><input type="number" value="${i.price}" onchange="setP('${i.id}',this.value)"></td><td>${eur(i.qty*i.price)}</td><td>${+i.price?'<span class="tag">con precio</span>':'<span class="tag" style="background:#ffe3e6">sin precio</span>'}</td><td><button class="d" onclick="delItem('${i.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=8>Sin partidas.</td></tr>'}</table></div>
<div class="cols" style="margin-top:14px"><div class="card"><h3>Resumen por estancia</h3>${Object.entries(g).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${eur(v)}</b></div>`).join('')}</div>
<div class="card"><h3>Total</h3><div class="row" style="justify-content:space-between"><span>Base</span><b>${eur(t)}</b></div><div class="row" style="justify-content:space-between"><span>IVA ${S.set.iva}%</span><b>${eur(t*S.set.iva/100)}</b></div><div class="row" style="justify-content:space-between"><span>ICIO ${S.set.icio}%</span><b>${eur(t*S.set.icio/100)}</b></div><div class="row" style="justify-content:space-between"><span><b>Estimado</b></span><b>${eur(withTax(t))}</b></div>
<div class="row"><label>Presupuesto máximo <input type="number" value="${S.set.budgetMax}" onchange="S.set.budgetMax=+this.value;save();render()"></label></div></div></div>`}
function addItem(){if(!id.value.trim())return;S.items.push({id:uid(),room:ir.value,desc:id.value,qty:+iq.value||1,unit:iu.value||'ud',price:+ip.value||0});save();render()}
function setP(i,v){S.items.find(x=>x.id==i).price=+v;save();render()}function delItem(i){S.items=S.items.filter(x=>x.id!=i);save();render()}
function offers(){const names=[...new Set(S.offers.map(o=>o.co))];const best={};S.offers.forEach(o=>{const k=o.desc;if(!best[k]||o.price<best[k])best[k]=o.price});
const tot=n=>S.offers.filter(o=>o.co==n).reduce((a,o)=>a+o.qty*o.price,0);
return `<h2>Ofertas de empresas</h2><p>Importa el presupuesto de cada empresa en CSV (columnas: empresa;partida;cantidad;precio). Compara y adjudica.</p><div class="row noprint"><label class="p">Importar CSV de ofertas<input type="file" accept=".csv,.txt" hidden onchange="readFile(this.files[0],impOffers)"></label><button class="s" onclick="dl('plantilla-ofertas.csv',csvOut(['empresa','partida','cantidad','precio'],[['Empresa A','Alicatado baño','12','38'],['Empresa B','Alicatado baño','12','41']]))">Descargar plantilla</button></div>
${names.length?`<div class="cols">${names.map(n=>`<div class="card"><b>${esc(n)}</b><h3>${eur(tot(n))}</h3><small>${S.offers.filter(o=>o.co==n).length} líneas</small><div class="row">${S.offers.some(o=>o.co==n&&o.won)?'<span class="tag" style="background:#d9f3e8">Adjudicada</span>':`<button class="p" onclick="award('${esc(n)}')">Adjudicar</button>`}</div></div>`).join('')}</div>
<div class="card" style="margin-top:14px;overflow:auto"><table><tr><th>Partida</th>${names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr>${Object.keys(best).map(k=>`<tr><td>${esc(k)}</td>${names.map(n=>{const o=S.offers.find(x=>x.co==n&&x.desc==k);return `<td style="${o&&o.price==best[k]?'color:var(--ok);font-weight:600':''}">${o?eur(o.price):'<span style="color:var(--bad)">falta</span>'}</td>`}).join('')}</tr>`).join('')}</table></div><p class="warn">«falta» marca partidas que una empresa no ha incluido. Compara siempre el mismo alcance antes de decidir por precio.</p>`:''}`}
function impOffers(t){const r=csvParse(t).slice(1);r.forEach(x=>S.offers.push({id:uid(),co:x[0],desc:x[1],qty:num(x[2])||1,price:num(x[3])}));save();render()}
function award(n){S.offers.forEach(o=>o.won=o.co==n);S.items=S.offers.filter(o=>o.co==n).map(o=>({id:uid(),room:'',desc:o.desc,qty:o.qty,unit:'ud',price:o.price}));save();alert('Oferta adjudicada: sus líneas son ahora tu presupuesto.');go('budget')}
function cos(){return `<h2>Empresas de reformas en Málaga</h2><p>Directorio propio: añade o importa empresas (CSV: nombre;zona;especialidad;teléfono;email;web;valoración;notas). Cada ficha lleva sus avisos de verificación.</p>
<div class="row noprint"><input id="cn" placeholder="Nombre"><input id="cz" placeholder="Zona (ej. Centro, Teatinos)"><input id="cs" placeholder="Especialidad"><input id="ct" placeholder="Teléfono"><button class="p" onclick="addCo()">Añadir</button><button class="s" onclick="seedCo()">Cargar 13 empresas de Málaga</button><label class="s" style="padding:7px 12px;border-radius:9px;background:#e8eef3;cursor:pointer">Importar CSV<input type="file" accept=".csv,.txt" hidden onchange="readFile(this.files[0],impCo)"></label><input id="cq" placeholder="Buscar…" oninput="filt()"></div>
<div class="grid" id="colist">${coList('')}</div>
<div class="card" style="margin-top:14px"><h3>Antes de contratar, comprueba</h3><ul><li>Seguro de responsabilidad civil y copia de la póliza</li><li>Alta en Seguridad Social y al corriente con Hacienda</li><li>Presupuesto detallado por partidas, con plazo y garantía</li><li>Referencias y obras previas en Málaga</li><li>Forma de pago ligada a avance de obra, nunca todo por adelantado</li></ul></div>`}
function coList(q){return S.cos.filter(c=>JSON.stringify(c).toLowerCase().includes(q)).map(c=>`<div class="card"><b>${esc(c.n)}</b> <button class="d" onclick="delCo('${c.id}')">✕</button><br><span class="tag">${esc(c.z||'Málaga')}</span> <span class="tag">${esc(c.s||'Reformas')}</span><p>${c.t?`📞 <a href="tel:${esc(c.t)}">${esc(c.t)}</a><br>`:''}${c.e?`✉️ ${esc(c.e)}<br>`:''}${c.w?`🌐 ${esc(c.w)}<br>`:''}${c.r?`⭐ ${esc(c.r)}<br>`:''}<small>${esc(c.o||'')}</small></p><label><input type="checkbox" ${c.ins?'checked':''} onchange="chk('${c.id}','ins',this.checked)"> Seguro verificado</label><br><label><input type="checkbox" ${c.ref?'checked':''} onchange="chk('${c.id}','ref',this.checked)"> Referencias comprobadas</label></div>`).join('')||'<p>Sin empresas todavía. Importa un CSV o añade la primera.</p>'}
function seedCo(){SEED.forEach(c=>{if(!S.cos.some(x=>x.w==c.w))S.cos.push({id:uid(),...c})});save();render()}
function filt(){colist.innerHTML=coList(cq.value.toLowerCase())}function chk(i,k,v){S.cos.find(c=>c.id==i)[k]=v;save()}
function addCo(){if(!cn.value.trim())return;S.cos.push({id:uid(),n:cn.value,z:cz.value,s:cs.value,t:ct.value});save();render()}function delCo(i){S.cos=S.cos.filter(c=>c.id!=i);save();render()}
function impCo(t){csvParse(t).slice(1).forEach(x=>S.cos.push({id:uid(),n:x[0],z:x[1],s:x[2],t:x[3],e:x[4],w:x[5],r:x[6],o:x[7]}));save();render()}
function tasks(){return `<h2>Tareas por fase</h2><div class="row noprint"><input id="tt" placeholder="Nueva tarea"><select id="tf">${FASES.map(f=>`<option>${f}</option>`).join('')}</select><button class="p" onclick="S.tasks.push({id:uid(),f:tf.value,t:tt.value,done:false});save();render()">Añadir</button></div>${FASES.map(f=>{const L=S.tasks.filter(t=>t.f==f);return `<div class="card" style="margin-bottom:12px"><h3>${f} <span class="tag">${L.filter(t=>t.done).length}/${L.length}</span></h3>${L.map(t=>`<div><label><input type="checkbox" ${t.done?'checked':''} onchange="S.tasks.find(x=>x.id=='${t.id}').done=this.checked;save();render()"> ${t.done?'<s>'+esc(t.t)+'</s>':esc(t.t)}</label></div>`).join('')}</div>`}).join('')}`}
function pays(){const tp=S.pays.reduce((a,p)=>a+ +p.amt,0),pd=S.pays.filter(p=>p.paid).reduce((a,p)=>a+ +p.amt,0);return `<h2>Pagos</h2><div class="row noprint"><input id="pc" placeholder="Concepto / empresa"><input id="pa" type="number" placeholder="€"><input id="pd" type="date"><button class="p" onclick="S.pays.push({id:uid(),c:pc.value,amt:+pa.value||0,d:pd.value,paid:false});save();render()">Añadir</button></div><div class="card"><table><tr><th>Concepto</th><th>Fecha</th><th>Importe</th><th>Pagado</th><th></th></tr>${S.pays.map(p=>`<tr><td>${esc(p.c)}</td><td>${p.d}</td><td>${eur(p.amt)}</td><td><input type="checkbox" style="width:auto" ${p.paid?'checked':''} onchange="S.pays.find(x=>x.id=='${p.id}').paid=this.checked;save();render()"></td><td><button class="d" onclick="S.pays=S.pays.filter(x=>x.id!='${p.id}');save();render()">✕</button></td></tr>`).join('')}</table><p>Pagado ${eur(pd)} de ${eur(tp)} planificado.</p></div><p class="warn">Consejo: liga cada pago a un hito de obra y guarda siempre la factura.</p>`}
function permits(){return `<h2>Trámites y tasas en Málaga</h2><div class="warn">Esta pantalla es una guía. No sustituye al Ayuntamiento. Confirma el trámite y los tipos vigentes en la sede electrónica del Ayuntamiento de Málaga o con tu arquitecto antes de empezar. El % de ICIO de este modelo es editable y no está verificado.</div>
<div class="card"><div class="row"><label>ICIO % <input type="number" step=".1" value="${S.set.icio}" onchange="S.set.icio=+this.value;save()"></label><label>IVA obra % <input type="number" value="${S.set.iva}" onchange="S.set.iva=+this.value;save()"> <small>(10% reforma de vivienda, si cumple requisitos; confírmalo)</small></label></div></div>
<div class="cols" style="margin-top:14px"><div class="card"><h3>¿Qué trámite necesito?</h3><select id="pq" onchange="pr.innerHTML=permInfo(this.value)"><option value="">Elige el tipo de obra</option><option value="a">Pintura, suelos, cambio de sanitarios</option><option value="b">Reformar baño o cocina sin tocar estructura</option><option value="c">Mover o tirar tabiques</option><option value="d">Tocar estructura, fachada o elementos comunes</option></select><div id="pr" style="margin-top:10px"></div></div>
<div class="card"><h3>Documentos habituales</h3><ul><li>Memoria o presupuesto de la obra</li><li>Plano o croquis si cambias distribución</li><li>Proyecto técnico si hay estructura</li><li>Permiso de la comunidad si afecta a elementos comunes</li><li>Justificante de tasas e ICIO</li></ul></div></div>`}
function permInfo(v){return {a:'Normalmente obra menor sin licencia previa o con comunicación. Confirma en el Ayuntamiento.',b:'Suele pedir declaración responsable o comunicación previa. Si tocas instalaciones, confirma boletín o certificado.',c:'Cambia la distribución. Habitualmente requiere declaración responsable y plano. Valida con técnico.',d:'Casi seguro licencia, proyecto técnico y acuerdo de la comunidad.'}[v]+'<br><small>Orientativo. Verificar con la fuente oficial.</small>'}
function data(){return `<h2>Datos / CSV</h2><div class="card" style="margin-bottom:14px"><h3>Ejemplo y limpieza</h3><div class="row"><button class="p" onclick="loadDemo()">Cargar ejemplo</button><button class="s" onclick="restoreDemo()">Restaurar ejemplo inicial</button></div><div class="row"><select id="czs"><option value="">Borrar por apartado…</option><option value="rooms">Estancias y fotos</option><option value="items">Presupuesto</option><option value="offers">Ofertas</option><option value="pays">Pagos</option><option value="cos">Empresas</option><option value="tasks">Tareas</option></select><button class="s" onclick="clearZone(czs.value)">Borrar apartado</button></div><div class="row"><button class="d" style="border:1px solid var(--bad);border-radius:9px;padding:7px 12px" onclick="clearAll()">Borrar toda la web (dejarla vacía)</button></div><small>Todo se guarda solo en este navegador. «Borrar toda la web» sirve para pasarla a otra persona.</small></div><div class="cols"><div class="card"><h3>Importar presupuesto</h3><p>Columnas: estancia;partida;cantidad;unidad;precio</p><label class="p">Elegir CSV<input type="file" accept=".csv,.txt" hidden onchange="readFile(this.files[0],impBud)"></label> <button class="s" onclick="dl('plantilla-presupuesto.csv',csvOut(['estancia','partida','cantidad','unidad','precio'],[['Baño','Alicatado','12','m2','38'],['Cocina','Muebles','1','ud','']]))">Plantilla</button><p>Si tu CSV usa otras columnas, se leen en este orden. Las estancias nuevas se crean solas.</p></div>
<div class="card"><h3>Exportar</h3><button class="s" onclick="dl('presupuesto.csv',csvOut(['estancia','partida','cantidad','unidad','precio','total'],S.items.map(i=>[i.room,i.desc,i.qty,i.unit,i.price,i.qty*i.price])))">Presupuesto CSV</button> <button class="s" onclick="dl('tareas.csv',csvOut(['fase','tarea','hecha'],S.tasks.map(t=>[t.f,t.t,t.done?'sí':'no'])))">Tareas CSV</button> <button class="s" onclick="dl('empresas.csv',csvOut(['nombre','zona','especialidad','telefono','email','web','valoracion','notas'],S.cos.map(c=>[c.n,c.z,c.s,c.t,c.e,c.w,c.r,c.o])))">Empresas CSV</button> <button class="s" onclick="window.print()">Imprimir / PDF</button></div>
<div class="card"><h3>Copia completa (con fotos)</h3><button class="s" onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='reforma-copia.json';a.click()">Descargar copia</button> <label class="s" style="padding:7px 12px;border-radius:9px;background:#e8eef3;cursor:pointer">Restaurar<input type="file" accept=".json" hidden onchange="readFile(this.files[0],t=>{localStorage.rmm=t;location.reload()})"></label><p><button class="d" onclick="if(confirm('¿Borrar todo?')){localStorage.removeItem('rmm');location.reload()}">Borrar todos los datos</button></p></div></div>`}
function impBud(t){csvParse(t).slice(1).forEach(x=>{const room=(x[0]||'').trim();if(room&&!S.rooms.some(r=>r.name==room))S.rooms.push({id:uid(),name:room,m2:0});S.items.push({id:uid(),room,desc:x[1]||'',qty:num(x[2])||1,unit:x[3]||'ud',price:num(x[4])})});save();go('budget')}
if(!localStorage.rmm&&!localStorage.rmmDone){const d=mkDemo();S.rooms=d.rooms;S.items=d.items;S.offers=d.offers;S.pays=d.pays;S.cos=SEED.map(c=>({id:uid(),...c}));save()}
nav();render();
</script></body></html>
